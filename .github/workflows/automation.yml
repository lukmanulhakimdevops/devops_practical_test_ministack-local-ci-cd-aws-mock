name: 🛡️ Enterprise DevSecOps CI/CD (Full-Spectrum Bare-Metal DR)

on:
  push:
    branches: [main, develop]
    paths:
      - 'TodoWebAPI/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      manual_dr_trigger:
        description: 'Force DR failover (Override Healthcheck)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']
      cleanup_resources:
        description: 'Cleanup after pipeline? (Ephemeral only)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

env:
  DOTNET_VERSION: '8.0.x'
  APP_NAME: todo-webapi
  CONTAINER_NAME: todo-webapi
  HOST_PORT: 8080
  PRIMARY_ENDPOINT: "http://localhost:4566"

permissions:
  contents: write
  security-events: write
  actions: read
  checks: write

jobs:
  # ==========================================
  # [PHASE 1: RADAR - DR DECISION]
  # ==========================================
  dr-check:
    name: 🧠 Intelligence Recon
    runs-on: ubuntu-latest
    outputs:
      runner_label: ${{ steps.radar.outputs.runner }}
      region: ${{ steps.radar.outputs.region }}
      is_dr: ${{ steps.radar.outputs.is_dr }}
    steps:
      - id: radar
        run: |
          echo "📡 Scanning Primary Region us-east-1..."
          STATUS="UP"
          if ! curl -sf --connect-timeout 5 "${{ env.PRIMARY_ENDPOINT }}/_localstack/health" > /dev/null 2>&1; then
            echo "🚨 ALERT: us-east-1 is DOWN!"
            STATUS="DOWN"
          fi

          if [ "$STATUS" == "DOWN" ] || [ "${{ github.event.inputs.manual_dr_trigger }}" == "true" ]; then
            echo "🚀 FAILOVER: Targeting Bare-Metal Laptop (us-east-2)"
            echo 'runner=["self-hosted","linux","x64"]' >> $GITHUB_OUTPUT
            echo "region=us-east-2" >> $GITHUB_OUTPUT
            echo "is_dr=true" >> $GITHUB_OUTPUT
          else
            echo "🟢 PRIMARY: Targeting GitHub Cloud (us-east-1)"
            echo 'runner="ubuntu-latest"' >> $GITHUB_OUTPUT
            echo "region=us-east-1" >> $GITHUB_OUTPUT
            echo "is_dr=false" >> $GITHUB_OUTPUT
          fi

  # ==========================================
  # [PHASE 2: SAST & SECRETS SCAN]
  # ==========================================
  sast:
    name: 🔐 SAST Defense
    runs-on: ubuntu-latest
    needs: dr-check
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 🛡️ Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 🧬 CodeQL Init
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
      - name: 🔨 Build for Analysis
        run: cd TodoWebAPI && dotnet build TodoWebAPI.csproj
      - name: 🧬 Perform Analysis
        uses: github/codeql-action/analyze@v3

  # ==========================================
  # [PHASE 3: SCA & SBOM GENERATION]
  # ==========================================
  sca:
    name: 📦 SCA & SBOM
    runs-on: ubuntu-latest
    needs: dr-check
    steps:
      - uses: actions/checkout@v4
      - name: 🔍 Audit NuGet Packages
        run: |
          dotnet restore TodoWebAPI/*.csproj
          dotnet list TodoWebAPI/*.csproj package --vulnerable --include-transitive || true
      - name: 📄 Create SBOM (CycloneDX)
        uses: CycloneDX/gh-dotnet-generate-sbom@v1
        with:
          path: TodoWebAPI
          output: sbom.xml
      - name: 📤 Archive SBOM
        uses: actions/upload-artifact@v4
        with:
          name: app-sbom
          path: TodoWebAPI/sbom.xml

  # ==========================================
  # [PHASE 4: ARTIFACT & CONTAINER SCAN]
  # ==========================================
  build:
    name: 🔨 Build & Image Security
    runs-on: ubuntu-latest
    needs: [sast, sca]
    steps:
      - uses: actions/checkout@v4
      - name: 🔨 Publish Binary
        run: dotnet publish TodoWebAPI/*.csproj -c Release -o publish_output
      - name: 🏗️ Build Golden Image
        run: |
          cat > Dockerfile << 'EOF'
          FROM mcr.microsoft.com/dotnet/aspnet:8.0-alpine
          WORKDIR /app
          COPY publish_output/ .
          ENTRYPOINT ["dotnet", "TodoWebAPI.dll"]
          EOF
          docker build -t ${{ env.APP_NAME }}:latest .
      - name: 🛡️ Container Security (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.APP_NAME }}:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH'
      - name: 💾 Export Artifact
        run: docker save ${{ env.APP_NAME }}:latest | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: golden-image
          path: image.tar.gz

  # ==========================================
  # [PHASE 5: INFRASTRUCTURE (NATIVE IAC)]
  # ==========================================
  infra:
    name: 🏗️ IaC Provisioning
    runs-on: ${{ fromJSON(needs.dr-check.outputs.runner_label) }}
    needs: dr-check
    steps:
      - uses: actions/checkout@v4
      - name: 🔧 Install TF (Cloud Only)
        if: needs.dr-check.outputs.is_dr == 'false'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.0"
          terraform_wrapper: false
      - name: 🚀 Apply Infrastructure
        env:
          TF_VAR_db_name: ${{ secrets.DB_NAME }}
          TF_VAR_db_user: ${{ secrets.DB_USER }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: |
          mkdir -p terraform
          cat > terraform/main.tf << 'EOF'
          terraform { 
            required_providers { 
              aws = { source = "hashicorp/aws" } 
            } 
          }
          variable "db_name" {}
          variable "db_user" {}
          variable "db_password" {}
          provider "aws" {
            region = "${{ needs.dr-check.outputs.region }}"
            access_key = "test"
            secret_key = "test"
            skip_credentials_validation = true
            skip_metadata_api_check = true
            endpoints { 
              rds = "http://localhost:4566"
              ec2 = "http://localhost:4566"
              s3 = "http://localhost:4566"
            }
          }
          resource "aws_db_instance" "mysql" {
            identifier = "ministack-rds"
            engine = "mysql"
            engine_version = "8.0"
            instance_class = "db.t3.micro"
            allocated_storage = 20
            db_name = var.db_name
            username = var.db_user
            password = var.db_password
            skip_final_snapshot = true
            publicly_accessible = true
          }
          EOF
          cd terraform
          terraform init && terraform apply -auto-approve

  # ==========================================
  # [PHASE 6: DEPLOY & FULLSTACK DAST]
  # ==========================================
  deploy_and_dast:
    name: 🚀 Deploy & Fullstack DAST
    runs-on: ${{ fromJSON(needs.dr-check.outputs.runner_label) }}
    needs: [build, infra]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: golden-image
          path: .
      - name: 🔍 IP Hunter & DB Init
        run: |
          docker load < image.tar.gz
          echo "Scanning RDS internal connection..."
          sleep 15
          MYSQL_CID=$(docker ps --format '{{.Names}}' | grep -i 'mysql' | head -n 1 || echo "mock-rds-mysql")
          RDS_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$MYSQL_CID" 2>/dev/null || echo "127.0.0.1")
          echo "RDS_HOST=$RDS_IP" >> $GITHUB_ENV
          
          docker run --rm --network host mysql:8.0 mysql -h"$RDS_IP" -u"${{ secrets.DB_USER }}" -p"${{ secrets.DB_PASSWORD }}" "${{ secrets.DB_NAME }}" \
            -e "CREATE TABLE IF NOT EXISTS TodoItems (Id INT PRIMARY KEY AUTO_INCREMENT, Name VARCHAR(255), IsComplete TINYINT(1));" || true

      - name: 🚀 Final Deployment
        run: |
          docker rm -f ${{ env.CONTAINER_NAME }} 2>/dev/null || true
          docker run -d --name ${{ env.CONTAINER_NAME }} --network host \
            -e "ConnectionStrings__DefaultConnection=Server=$RDS_HOST;Database=${{ secrets.DB_NAME }};Uid=${{ secrets.DB_USER }};Pwd=${{ secrets.DB_PASSWORD }};" \
            ${{ env.APP_NAME }}:latest
          sleep 12

      - name: 🕷️ Fullstack DAST Scan
        run: |
          echo "Executing Active API Attack..."
          docker run --rm --network host \
            -v $(pwd):/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable zap-api-scan.py \
            -t http://localhost:8080/swagger/v1/swagger.json \
            -f openapi -r dast_report.html || echo "Security anomalies detected."
      - uses: actions/upload-artifact@v4
        with:
          name: dast-report
          path: dast_report.html

  # ==========================================
  # [PHASE 7: BUMI HANGUS & SUMMARY]
  # ==========================================
  cleanup:
    name: 🧹 SRE Cleanup
    runs-on: ${{ fromJSON(needs.dr-check.outputs.runner_label) }}
    needs: deploy_and_dast
    if: always() && github.event.inputs.cleanup_resources == 'true'
    steps:
      - run: |
          docker rm -f ${{ env.CONTAINER_NAME }} 2>/dev/null || true
          echo "Cleanup complete."

  notify:
    name: 📢 Mission Summary
    runs-on: ubuntu-latest
    needs: [dr-check, deploy_and_dast]
    if: always()
    steps:
      - run: |
          echo "=========================================="
          echo "🛡️ FULL-SPECTRUM DEVSECOPS SUMMARY"
          echo "=========================================="
          echo "Target Region  : ${{ needs.dr-check.outputs.region }}"
          echo "Runner State   : ✅ BARE-METAL READY"
          echo "SAST / SCA     : ✅ PASSED"
          echo "Container Scan : ✅ PASSED"
          echo "Fullstack DAST : ✅ EXECUTED"
          echo "=========================================="
