name: 🛡️ Enterprise DevSecOps CI/CD (GitHub-Hosted + Self-Hosted Compatible)

on:
  push:
    branches: [main, develop]
    paths:
      - 'TodoWebAPI/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      manual_dr_trigger:
        description: 'Force DR failover to us-east-2 (Override Healthcheck)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']
      force_primary_deploy:
        description: 'FORCE deploy to us-east-1 even if health check fails'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']
      cleanup_resources:
        description: 'Cleanup after pipeline? (Ephemeral only)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

env:
  DOTNET_VERSION: '8.0.x'
  APP_NAME: todo-webapi
  CONTAINER_NAME: todo-webapi
  HOST_PORT: 8080
  PRIMARY_ENDPOINT: 'http://localhost:4566'
  AWS_REGION_PRIMARY: us-east-1
  AWS_REGION_DR: us-east-2
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  DB_NAME: ${{ secrets.DB_NAME }}
  DB_USER: ${{ secrets.DB_USER }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  TF_STATE_BUCKET: ministack-terraform-state
  TF_STATE_KEY: devsecops/todo-webapi/terraform.tfstate

permissions:
  contents: write
  security-events: write
  actions: read
  checks: write

jobs:
  # ==========================================
  # [PHASE 1: RADAR - DR DECISION WITH RUNNER TYPE DETECTION]
  # ==========================================
  dr-check:
    name: 🧠 Intelligence Recon + Runner Detection
    runs-on: ubuntu-latest
    outputs:
      runner_label: ${{ steps.radar.outputs.runner }}
      region: ${{ steps.radar.outputs.region }}
      is_dr: ${{ steps.radar.outputs.is_dr }}
      ministack_port: ${{ steps.radar.outputs.port }}
      env_name: ${{ steps.radar.outputs.env_name }}
      force_primary: ${{ steps.radar.outputs.force_primary }}
      runner_type: ${{ steps.radar.outputs.runner_type }}  # github-hosted or self-hosted
      network_mode: ${{ steps.radar.outputs.network_mode }}  # bridge or host
      docker_socket: ${{ steps.radar.outputs.docker_socket }}  # true or false
    steps:
      - id: radar
        run: |
          FAIL="${{ github.event.inputs.manual_dr_trigger }}"
          FORCE_PRIMARY="${{ github.event.inputs.force_primary_deploy }}"
          ENV_NAME="staging"
          
          echo "📡 Scanning Primary Region us-east-1..."
          STATUS="UP"
          if ! curl -sf --connect-timeout 5 "${{ env.PRIMARY_ENDPOINT }}/_localstack/health" > /dev/null 2>&1; then
            echo "🚨 ALERT: us-east-1 health check FAILED!"
            STATUS="DOWN"
          fi

          # DR Decision Logic with Runner Type Detection
          if [ "$FORCE_PRIMARY" == "true" ]; then
            echo "⚡ FORCE_PRIMARY=true: Deploying to us-east-1 (GitHub-hosted)"
            echo 'runner=["ubuntu-latest"]' >> $GITHUB_OUTPUT
            echo "region=${{ env.AWS_REGION_PRIMARY }}" >> $GITHUB_OUTPUT
            echo "is_dr=false" >> $GITHUB_OUTPUT
            echo "port=4566" >> $GITHUB_OUTPUT
            echo "force_primary=true" >> $GITHUB_OUTPUT
            echo "runner_type=github-hosted" >> $GITHUB_OUTPUT
            echo "network_mode=bridge" >> $GITHUB_OUTPUT  # GitHub-hosted: use bridge
            echo "docker_socket=false" >> $GITHUB_OUTPUT  # Cannot mount socket
          elif [ "$FAIL" == "true" ] || [ "$STATUS" == "DOWN" ]; then
            echo "🚀 FAILOVER: Targeting Bare-Metal Laptop (us-east-2)"
            echo 'runner=["self-hosted","linux","x64"]' >> $GITHUB_OUTPUT
            echo "region=${{ env.AWS_REGION_DR }}" >> $GITHUB_OUTPUT
            echo "is_dr=true" >> $GITHUB_OUTPUT
            echo "port=4566" >> $GITHUB_OUTPUT
            echo "force_primary=false" >> $GITHUB_OUTPUT
            echo "runner_type=self-hosted" >> $GITHUB_OUTPUT
            echo "network_mode=host" >> $GITHUB_OUTPUT  # Self-hosted: use host network
            echo "docker_socket=true" >> $GITHUB_OUTPUT  # Can mount socket
          else
            echo "🟢 PRIMARY: Targeting GitHub Cloud (us-east-1)"
            echo 'runner=["ubuntu-latest"]' >> $GITHUB_OUTPUT
            echo "region=${{ env.AWS_REGION_PRIMARY }}" >> $GITHUB_OUTPUT
            echo "is_dr=false" >> $GITHUB_OUTPUT
            echo "port=4566" >> $GITHUB_OUTPUT
            echo "force_primary=false" >> $GITHUB_OUTPUT
            echo "runner_type=github-hosted" >> $GITHUB_OUTPUT
            echo "network_mode=bridge" >> $GITHUB_OUTPUT
            echo "docker_socket=false" >> $GITHUB_OUTPUT
          fi
          echo "env_name=$ENV_NAME" >> $GITHUB_OUTPUT
          echo "📊 Decision: runner=${{ steps.radar.outputs.runner_type }} | network=${{ steps.radar.outputs.network_mode }}"

  # ==========================================
  # [PHASE 2-4: SAST/SCA/BUILD - Same for both]
  # ==========================================
  sast:
    name: 🔐 SAST Defense
    runs-on: ubuntu-latest
    needs: dr-check
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 🛡️ Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 🧬 CodeQL Init
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
      - name: 🔨 Build for Analysis
        run: cd TodoWebAPI && dotnet build TodoWebAPI.csproj
      - name: 🧬 Perform Analysis
        uses: github/codeql-action/analyze@v3

  sca:
    name: 📦 SCA & SBOM
    runs-on: ubuntu-latest
    needs: dr-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: 🔍 Audit NuGet Packages
        run: |
          dotnet restore TodoWebAPI/*.csproj
          dotnet list TodoWebAPI/*.csproj package --vulnerable --include-transitive || true
      - name: 📄 Create SBOM (CycloneDX)
        uses: CycloneDX/gh-dotnet-generate-sbom@v1
        with:
          path: TodoWebAPI
          output: sbom.xml
      - name: 📤 Archive SBOM
        uses: actions/upload-artifact@v4
        with:
          name: app-sbom
          path: TodoWebAPI/sbom.xml
          retention-days: 7

  build:
    name: 🔨 Build & Image Security
    runs-on: ubuntu-latest
    needs: [sast, sca]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: 🔨 Publish Binary
        run: dotnet publish TodoWebAPI/*.csproj -c Release -o publish_output
      - name: 🏗️ Build Golden Image
        run: |
          cat > Dockerfile << 'EOF'
          FROM mcr.microsoft.com/dotnet/aspnet:8.0-alpine
          WORKDIR /app
          COPY publish_output/ .
          ENTRYPOINT ["dotnet", "TodoWebAPI.dll"]
          EOF
          docker build -t ${{ env.APP_NAME }}:latest .
      - name: 🛡️ Container Security (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.APP_NAME }}:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
      - name: 💾 Export Artifact
        run: docker save ${{ env.APP_NAME }}:latest | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: golden-image
          path: image.tar.gz
          retention-days: 7

  # ==========================================
  # [PHASE 5: INFRASTRUCTURE - RUNNER-AWARE]
  # ==========================================
  infra:
    name: 🏗️ IaC Provisioning (Runner-Aware)
    runs-on: ${{ fromJSON(needs.dr-check.outputs.runner_label) }}
    needs: dr-check
    outputs:
      rds_endpoint: ${{ steps.tf.outputs.rds_endpoint }}
      mysql_host: ${{ steps.network-config.outputs.mysql_host }}
      mysql_port: ${{ steps.network-config.outputs.mysql_port }}
    env:
      MS_PORT: ${{ needs.dr-check.outputs.ministack_port }}
      REGION: ${{ needs.dr-check.outputs.region }}
      ENV_NAME: ${{ needs.dr-check.outputs.env_name }}
      RUNNER_TYPE: ${{ needs.dr-check.outputs.runner_type }}
      NETWORK_MODE: ${{ needs.dr-check.outputs.network_mode }}
      DOCKER_SOCKET: ${{ needs.dr-check.outputs.docker_socket }}
    steps:
      - uses: actions/checkout@v4

      - name: 🔧 Install Terraform & Start Ministack (GitHub-Hosted)
        if: needs.dr-check.outputs.is_dr == 'false'
        run: |
          if ! command -v terraform &>/dev/null; then
            curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
            sudo apt-get update -qq && sudo apt-get install -y terraform
          fi
          terraform version

          # GitHub-hosted: Cannot mount docker socket, use bridge network
          docker rm -f ministack 2>/dev/null || true
          docker run -d --name ministack \
            -p ${MS_PORT}:4566 \
            -e SERVICES=ec2,s3,sts,iam,rds \
            -e DEFAULT_REGION=${REGION} \
            -e DOCKER_HOST=unix:///var/run/docker.sock \
            nahuelnucera/ministack:latest

          echo "⏳ Waiting for Ministack services..."
          for i in $(seq 1 40); do
            STATUS=$(curl -sf "http://localhost:${MS_PORT}/_localstack/health" 2>/dev/null || echo '{}')
            S3=$(echo "$STATUS" | python3 -c "import sys,json; print(json.load(sys.stdin).get('services',{}).get('s3',''))" 2>/dev/null)
            RDS=$(echo "$STATUS" | python3 -c "import sys,json; print(json.load(sys.stdin).get('services',{}).get('rds',''))" 2>/dev/null)
            if [ "$S3" = "available" ] && [ "$RDS" = "available" ]; then
              echo "✅ Ministack ready on GitHub-hosted runner"
              break
            fi
            sleep 3
          done

      - name: 💻 Verify Local Environment (Self-Hosted DR)
        if: needs.dr-check.outputs.is_dr == 'true'
        run: |
          terraform version || { echo "❌ Terraform not found."; exit 1; }
          if ! docker ps --format '{{.Names}}' | grep -q '^ministack$'; then
            echo "❌ Ministack not running."
            exit 1
          fi
          for i in $(seq 1 10); do
            curl -sf "http://localhost:${MS_PORT}/_localstack/health" && break
            sleep 2
          done
          echo "✅ Ministack ready on self-hosted runner"

      - name: 🔗 Configure Network Settings (Runner-Aware)
        id: network-config
        run: |
          if [ "${{ needs.dr-check.outputs.runner_type }}" == "self-hosted" ]; then
            # Self-hosted: Use host network, MySQL accessible at 127.0.0.1
            echo "🔗 Self-hosted runner: Using host network mode"
            echo "mysql_host=127.0.0.1" >> $GITHUB_OUTPUT
            echo "mysql_port=3306" >> $GITHUB_OUTPUT
          else
            # GitHub-hosted: Use bridge network, MySQL accessible via container name or published port
            echo "🔗 GitHub-hosted runner: Using bridge network mode"
            echo "mysql_host=localhost" >> $GITHUB_OUTPUT
