name: 🛡️ Enterprise DevSecOps CI/CD (GitHub-Hosted + Self-Hosted Compatible)

on:
  push:
    branches: [main, develop]
    paths:
      - 'TodoWebAPI/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      manual_dr_trigger:
        description: 'Force DR failover to us-east-2 (Override Healthcheck)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']
      force_primary_deploy:
        description: 'FORCE deploy to us-east-1 even if health check fails'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']
      cleanup_resources:
        description: 'Cleanup after pipeline? (Ephemeral only)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

env:
  DOTNET_VERSION: '8.0.x'
  APP_NAME: todo-webapi
  CONTAINER_NAME: todo-webapi
  HOST_PORT: 8080
  PRIMARY_ENDPOINT: 'http://localhost:4566'
  AWS_REGION_PRIMARY: us-east-1
  AWS_REGION_DR: us-east-2
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  DB_NAME: ${{ secrets.DB_NAME }}
  DB_USER: ${{ secrets.DB_USER }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  TF_STATE_BUCKET: ministack-terraform-state
  TF_STATE_KEY: devsecops/todo-webapi/terraform.tfstate

permissions:
  contents: write
  security-events: write
  actions: read
  checks: write

jobs:
  # ==========================================
  # [PHASE 1: RADAR - DR DECISION]
  # ==========================================
  dr-check:
    name: 🧠 Intelligence Recon
    runs-on: ubuntu-latest
    outputs:
      runner_label: ${{ steps.radar.outputs.runner }}
      region: ${{ steps.radar.outputs.region }}
      is_dr: ${{ steps.radar.outputs.is_dr }}
      ministack_port: ${{ steps.radar.outputs.port }}
      env_name: ${{ steps.radar.outputs.env_name }}
      runner_type: ${{ steps.radar.outputs.runner_type }}
    steps:
      - id: radar
        run: |
          FAIL="${{ github.event.inputs.manual_dr_trigger }}"
          FORCE_PRIMARY="${{ github.event.inputs.force_primary_deploy }}"
          ENV_NAME="staging"
          
          echo "📡 Scanning Primary Region us-east-1..."
          STATUS="UP"
          if ! curl -sf --connect-timeout 5 "${{ env.PRIMARY_ENDPOINT }}/_localstack/health" > /dev/null 2>&1; then
            echo "🚨 ALERT: us-east-1 health check FAILED!"
            STATUS="DOWN"
          fi

          if [ "$FORCE_PRIMARY" == "true" ]; then
            echo "⚡ FORCE_PRIMARY=true: Deploying to us-east-1 (GitHub-hosted)"
            echo 'runner=["ubuntu-latest"]' >> $GITHUB_OUTPUT
            echo "region=${{ env.AWS_REGION_PRIMARY }}" >> $GITHUB_OUTPUT
            echo "is_dr=false" >> $GITHUB_OUTPUT
            echo "port=4566" >> $GITHUB_OUTPUT
            echo "runner_type=github-hosted" >> $GITHUB_OUTPUT
          elif [ "$FAIL" == "true" ] || [ "$STATUS" == "DOWN" ]; then
            echo "🚀 FAILOVER: Targeting Bare-Metal Laptop (us-east-2)"
            echo 'runner=["self-hosted","linux","x64"]' >> $GITHUB_OUTPUT
            echo "region=${{ env.AWS_REGION_DR }}" >> $GITHUB_OUTPUT
            echo "is_dr=true" >> $GITHUB_OUTPUT
            echo "port=4566" >> $GITHUB_OUTPUT
            echo "runner_type=self-hosted" >> $GITHUB_OUTPUT
          else
            echo "🟢 PRIMARY: Targeting GitHub Cloud (us-east-1)"
            echo 'runner=["ubuntu-latest"]' >> $GITHUB_OUTPUT
            echo "region=${{ env.AWS_REGION_PRIMARY }}" >> $GITHUB_OUTPUT
            echo "is_dr=false" >> $GITHUB_OUTPUT
            echo "port=4566" >> $GITHUB_OUTPUT
            echo "runner_type=github-hosted" >> $GITHUB_OUTPUT
          fi
          echo "env_name=$ENV_NAME" >> $GITHUB_OUTPUT

  # ==========================================
  # [PHASE 2-4: SAST/SCA/BUILD]
  # ==========================================
  sast:
    name: 🔐 SAST Defense
    runs-on: ubuntu-latest
    needs: dr-check
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 🛡️ Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 🧬 CodeQL Init
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
      - name: 🔨 Build for Analysis
        run: cd TodoWebAPI && dotnet build TodoWebAPI.csproj
      - name: 🧬 Perform Analysis
        uses: github/codeql-action/analyze@v3

  sca:
    name: 📦 SCA & SBOM
    runs-on: ubuntu-latest
    needs: dr-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: 🔍 Audit NuGet Packages
        run: |
          dotnet restore TodoWebAPI/*.csproj
          dotnet list TodoWebAPI/*.csproj package --vulnerable --include-transitive || true
      - name: 📄 Create SBOM (CycloneDX)
        uses: CycloneDX/gh-dotnet-generate-sbom@v1
        with:
          path: TodoWebAPI
          output: sbom.xml
      - name: 📤 Archive SBOM
        uses: actions/upload-artifact@v4
        with:
          name: app-sbom
          path: TodoWebAPI/sbom.xml
          retention-days: 7

  build:
    name: 🔨 Build & Image Security
    runs-on: ubuntu-latest
    needs: [sast, sca]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: 🔨 Publish Binary
        run: dotnet publish TodoWebAPI/*.csproj -c Release -o publish_output
      - name: 🏗️ Build Golden Image
        run: |
          cat > Dockerfile << 'EOF'
          FROM mcr.microsoft.com/dotnet/aspnet:8.0-alpine
          WORKDIR /app
          COPY publish_output/ .
          ENTRYPOINT ["dotnet", "TodoWebAPI.dll"]
          EOF
          docker build -t ${{ env.APP_NAME }}:latest .
      - name: 🛡️ Container Security (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.APP_NAME }}:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
      - name: 💾 Export Artifact
        run: docker save ${{ env.APP_NAME }}:latest | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: golden-image
          path: image.tar.gz
          retention-days: 7

  # ==========================================
  # [PHASE 5: INFRASTRUCTURE]
  # ==========================================
  infra:
    name: 🏗️ IaC Provisioning
    runs-on: ${{ fromJSON(needs.dr-check.outputs.runner_label) }}
    needs: dr-check
    outputs:
      rds_endpoint: ${{ steps.tf.outputs.rds_endpoint }}
    env:
      MS_PORT: ${{ needs.dr-check.outputs.ministack_port }}
      REGION: ${{ needs.dr-check.outputs.region }}
      ENV_NAME: ${{ needs.dr-check.outputs.env_name }}
      RUNNER_TYPE: ${{ needs.dr-check.outputs.runner_type }}
    steps:
      - uses: actions/checkout@v4

      - name: 🔧 Install Terraform & Start Ministack (GitHub-Hosted)
        if: needs.dr-check.outputs.is_dr == 'false'
        run: |
          if ! command -v terraform &>/dev/null; then
            curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
            sudo apt-get update -qq && sudo apt-get install -y terraform
          fi
          terraform version

          docker rm -f ministack 2>/dev/null || true
          docker run -d --name ministack \
            -p ${MS_PORT}:4566 \
            -e SERVICES=ec2,s3,sts,iam,rds \
            -e DEFAULT_REGION=${REGION} \
            nahuelnucera/ministack:latest

          echo "⏳ Waiting for Ministack services..."
          for i in $(seq 1 40); do
            STATUS=$(curl -sf "http://localhost:${MS_PORT}/_localstack/health" 2>/dev/null || echo '{}')
            S3=$(echo "$STATUS" | python3 -c "import sys,json; print(json.load(sys.stdin).get('services',{}).get('s3',''))" 2>/dev/null)
            RDS=$(echo "$STATUS" | python3 -c "import sys,json; print(json.load(sys.stdin).get('services',{}).get('rds',''))" 2>/dev/null)
            if [ "$S3" = "available" ] && [ "$RDS" = "available" ]; then
              echo "✅ Ministack ready"
              break
            fi
            sleep 3
          done

      - name: 💻 Verify Local Environment (Self-Hosted DR)
        if: needs.dr-check.outputs.is_dr == 'true'
        run: |
          terraform version || { echo "❌ Terraform not found."; exit 1; }
          if ! docker ps --format '{{.Names}}' | grep -q '^ministack$'; then
            echo "❌ Ministack not running."
            exit 1
          fi
          for i in $(seq 1 10); do
            curl -sf "http://localhost:${MS_PORT}/_localstack/health" && break
            sleep 2
          done
          echo "✅ Ministack ready"

      - name: 🔗 Configure Network Settings (Runner-Aware)
        id: network-config
        run: |
          if [ "${{ needs.dr-check.outputs.runner_type }}" == "self-hosted" ]; then
            echo "🔗 Self-hosted: MySQL at 127.0.0.1:3306"
            echo "mysql_host=127.0.0.1" >> $GITHUB_OUTPUT
            echo "mysql_port=3306" >> $GITHUB_OUTPUT
          else
            echo "🔗 GitHub-hosted: MySQL at localhost:3306"
            echo "mysql_host=localhost" >> $GITHUB_OUTPUT
            echo "mysql_port=3306" >> $GITHUB_OUTPUT
          fi

      - name: 🪣 Ensure S3 Bucket for Terraform State
        run: |
          ENDPOINT_URL="http://localhost:${MS_PORT}"
          docker run --rm \
            -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            -e AWS_DEFAULT_REGION=${REGION} \
            amazon/aws-cli s3 mb "s3://${{ env.TF_STATE_BUCKET }}" \
            --endpoint-url "$ENDPOINT_URL" 2>/dev/null || true

      - name: 📝 Create Terraform config
        run: |
          mkdir -p terraform
          cat > terraform/main.tf << 'TFEOF'
          terraform {
            required_providers {
              aws = { source = "hashicorp/aws", version = "~> 5.0" }
              random = { source = "hashicorp/random", version = "~> 3.0" }
            }
            backend "s3" {}
          }

          variable "ministack_endpoint" {}
          variable "environment" {}
          variable "aws_region" {}
          variable "db_name" { sensitive = true }
          variable "db_user" { sensitive = true }
          variable "db_password" { sensitive = true }

          provider "aws" {
            region = var.aws_region
            access_key = "test"
            secret_key = "test"
            skip_credentials_validation = true
            skip_requesting_account_id = true
            skip_metadata_api_check = true
            s3_use_path_style = true
            endpoints {
              ec2 = var.ministack_endpoint
              s3 = var.ministack_endpoint
              sts = var.ministack_endpoint
              iam = var.ministack_endpoint
              rds = var.ministack_endpoint
            }
          }

          resource "random_id" "suffix" { byte_length = 4 }
          resource "aws_security_group" "web_sg" {
            name = "web-sg-${var.environment}-${var.aws_region}-${random_id.suffix.hex}"
            description = "SG for ${var.aws_region}"
            tags = { Name = "web-sg-${var.environment}", Project = "DevSecOps" }
            ingress { from_port = 80; to_port = 80; protocol = "tcp"; cidr_blocks = ["0.0.0.0/0"] }
            ingress { from_port = 443; to_port = 443; protocol = "tcp"; cidr_blocks = ["0.0.0.0/0"] }
            egress { from_port = 0; to_port = 0; protocol = "-1"; cidr_blocks = ["0.0.0.0/0"] }
          }
          resource "aws_instance" "web" {
            ami = "ami-0ff8a91507f77f867"
            instance_type = "t2.micro"
            security_groups = [aws_security_group.web_sg.name]
            tags = { Name = "web-server-${var.environment}", Project = "DevSecOps" }
          }
          resource "aws_s3_bucket" "artifacts" {
            bucket = "artifacts-${var.environment}-${var.aws_region}-${random_id.suffix.hex}"
            tags = { Project = "DevSecOps" }
          }
          resource "aws_db_instance" "mysql" {
            identifier = "ministack-mysql-${var.environment}-${random_id.suffix.hex}"
            engine = "mysql"
            engine_version = "8.0"
            instance_class = "db.t3.micro"
            allocated_storage = 20
            db_name = var.db_name
            username = var.db_user
            password = var.db_password
            port = 3306
            skip_final_snapshot = true
            apply_immediately = true
            publicly_accessible = true
            tags = { Project = "DevSecOps" }
          }
          output "rds_endpoint" { value = aws_db_instance.mysql.endpoint }
          output "s3_bucket" { value = aws_s3_bucket.artifacts.bucket }
          TFEOF

          cat > terraform/terraform.tfvars << EOF
          ministack_endpoint = "http://localhost:${MS_PORT}"
          environment = "${ENV_NAME}"
          aws_region = "${REGION}"
          EOF

      - name: 🗃️ Terraform Init (Remote S3 Backend)
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          terraform init -input=false -reconfigure -upgrade \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ needs.dr-check.outputs.region }}" \
            -backend-config="endpoint=http://localhost:${{ needs.dr-check.outputs.ministack_port }}" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="force_path_style=true"

      - name: 🧹 Force Clean Conflicting Resources
        run: |
          ENDPOINT_URL="http://localhost:${MS_PORT}"
          echo "🧹 Cleaning up any previously failed resources..."
          for db in "ministack-mysql-${ENV_NAME}" "ministack-mysql-${ENV_NAME}-"*; do
            docker run --rm \
              -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
              -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
              -e AWS_DEFAULT_REGION=${REGION} \
              amazon/aws-cli rds delete-db-instance \
              --db-instance-identifier "$db" \
              --skip-final-snapshot \
              --endpoint-url "$ENDPOINT_URL" 2>/dev/null || true
          done
          sleep 10

      - name: 🚀 Terraform Apply
        id: tf
        working-directory: terraform
        env:
          TF_VAR_db_name: ${{ secrets.DB_NAME }}
          TF_VAR_db_user: ${{ secrets.DB_USER }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: |
          terraform apply -auto-approve -input=false
          echo "rds_endpoint=$(terraform output -raw rds_endpoint)" >> $GITHUB_OUTPUT
          echo "✅ Terraform applied in ${REGION}"

  # ==========================================
  # [PHASE 6: DB INIT]
  # ==========================================
  db-init:
    name: 🗂️ DB Healthcheck & Init
    runs-on: ${{ fromJSON(needs.dr-check.outputs.runner_label) }}
    needs: [dr-check, infra]
    outputs:
      rds_host: ${{ steps.db-endpoint.outputs.host }}
      rds_port: ${{ steps.db-endpoint.outputs.port }}
    env:
      MS_PORT: ${{ needs.dr-check.outputs.ministack_port }}
      REGION: ${{ needs.dr-check.outputs.region }}
      ENV_NAME: ${{ needs.dr-check.outputs.env_name }}
      RUNNER_TYPE: ${{ needs.dr-check.outputs.runner_type }}
    steps:
      - name: 🐳 Wait for RDS Instance
        run: |
          ENDPOINT_URL="http://localhost:${MS_PORT}"
          DB_ID="ministack-mysql-${ENV_NAME}"
          
          echo "⏳ Waiting for RDS instance: $DB_ID in ${REGION}..."
          for i in $(seq 1 60); do
            STATUS=$(docker run --rm \
              -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
              -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
              -e AWS_DEFAULT_REGION=${REGION} \
              amazon/aws-cli rds describe-db-instances \
                --db-instance-identifier "$DB_ID" \
                --query "DBInstances[0].DBInstanceStatus" \
                --output text \
                --endpoint-url "$ENDPOINT_URL" 2>/dev/null || echo "creating")
            [ "$STATUS" = "available" ] && { echo "✅ RDS instance available"; break; }
            echo "  waiting... ($i/60) status=$STATUS"
            sleep 5
          done

      - name: 🔗 Set RDS Endpoint (Runner-Aware)
        id: db-endpoint
        run: |
          if [ "${{ env.RUNNER_TYPE }}" == "self-hosted" ]; then
            echo "🔗 Self-hosted: MySQL at 127.0.0.1:3306"
            echo "host=127.0.0.1" >> $GITHUB_OUTPUT
            echo "port=3306" >> $GITHUB_OUTPUT
          else
            echo "🔗 GitHub-hosted: MySQL at localhost:3306"
            echo "host=localhost" >> $GITHUB_OUTPUT
            echo "port=3306" >> $GITHUB_OUTPUT
          fi

      - name: 🏥 MySQL Health Check
        run: |
          RDS_HOST="${{ steps.db-endpoint.outputs.host }}"
          RDS_PORT="${{ steps.db-endpoint.outputs.port }}"
          
          echo "⏳ Waiting for MySQL at ${RDS_HOST}:${RDS_PORT} in ${REGION}..."
          for i in $(seq 1 60); do
            if docker run --rm \
              mysql:8.0 \
              mysql --protocol=TCP -h"${RDS_HOST}" -P"${RDS_PORT}" \
              -u"${{ env.DB_USER }}" -p"${{ env.DB_PASSWORD }}" \
              --connect-timeout=5 -e "SELECT 1" 2>/dev/null; then
              echo "✅ MySQL READY (attempt $i) in ${REGION}"
              exit 0
            fi
            echo "  waiting... ($i/60)"
            sleep 5
          done
          echo "❌ MySQL never became ready in ${REGION}"
          exit 1

      - name: 🗂️ Schema Initialization
        run: |
          RDS_HOST="${{ steps.db-endpoint.outputs.host }}"
          RDS_PORT="${{ steps.db-endpoint.outputs.port }}"
          
          docker run -i --rm \
            mysql:8.0 \
            mysql --protocol=TCP -h"${RDS_HOST}" -P"${RDS_PORT}" \
            -u"${{ env.DB_USER }}" -p"${{ env.DB_PASSWORD }}" "${{ env.DB_NAME }}" << 'SQL'
          CREATE TABLE IF NOT EXISTS TodoItems (
            Id INT PRIMARY KEY AUTO_INCREMENT,
            Name VARCHAR(255) NULL,
            IsComplete TINYINT(1) NOT NULL DEFAULT 0,
            CreatedAt TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
            UpdatedAt TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
          SQL
          echo "✅ Schema ready in ${REGION}"

  # ==========================================
  # [PHASE 7: DEPLOY & DAST]
  # ==========================================
  deploy:
    name: 🚀 Deploy & Fullstack DAST
    runs-on: ${{ fromJSON(needs.dr-check.outputs.runner_label) }}
    needs: [dr-check, build, db-init]
    env:
      MS_PORT: ${{ needs.dr-check.outputs.ministack_port }}
      REGION: ${{ needs.dr-check.outputs.region }}
      ENV_NAME: ${{ needs.dr-check.outputs.env_name }}
      RUNNER_TYPE: ${{ needs.dr-check.outputs.runner_type }}
    steps:
      - name: ⬇️ Download Golden Image
        if: needs.dr-check.outputs.is_dr == 'false'
        uses: actions/download-artifact@v4
        with:
          name: golden-image
          path: .

      - name: ⬇️ Download Golden Image (DR — latest main)
        if: needs.dr-check.outputs.is_dr == 'true'
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ${{ github.workflow }}
          branch: main
          name: golden-image
          path: .
          search_artifacts: true
          if_no_artifact_found: fail

      - name: 📦 Load Image
        run: docker load < image.tar.gz

      - name: 🔗 Set RDS Connection
        run: |
          RDS_HOST="${{ needs.db-init.outputs.rds_host }}"
          RDS_PORT="${{ needs.db-init.outputs.rds_port }}"
          echo "RDS_HOST=$RDS_HOST" >> $GITHUB_ENV
          echo "RDS_PORT=$RDS_PORT" >> $GITHUB_ENV
          echo "✅ Using RDS at $RDS_HOST:$RDS_PORT in ${REGION}"

      - name: 🧹 Remove Old Container
        run: docker rm -f ${{ env.CONTAINER_NAME }} 2>/dev/null || true

      - name: 🚀 Run App Container
        run: |
          if [ "${{ env.RUNNER_TYPE }}" == "self-hosted" ]; then
            docker run -d --name ${{ env.CONTAINER_NAME }} \
              --network host \
              --security-opt="no-new-privileges:true" \
              --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,size=64m \
              -e ASPNETCORE_URLS="http://+:${{ env.HOST_PORT }}" \
              -e ASPNETCORE_ENVIRONMENT=Production \
              -e "ConnectionStrings__DefaultConnection=Server=${{ env.RDS_HOST }};Port=${{ env.RDS_PORT }};Database=${{ env.DB_NAME }};Uid=${{ env.DB_USER }};Pwd=${{ env.DB_PASSWORD }};AllowPublicKeyRetrieval=true;" \
              ${{ env.APP_NAME }}:latest
          else
            docker run -d --name ${{ env.CONTAINER_NAME }} \
              -p ${{ env.HOST_PORT }}:${{ env.HOST_PORT }} \
              --security-opt="no-new-privileges:true" \
              --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,size=64m \
              -e ASPNETCORE_URLS="http://+:${{ env.HOST_PORT }}" \
              -e ASPNETCORE_ENVIRONMENT=Production \
              -e "ConnectionStrings__DefaultConnection=Server=${{ env.RDS_HOST }};Port=${{ env.RDS_PORT }};Database=${{ env.DB_NAME }};Uid=${{ env.DB_USER }};Pwd=${{ env.DB_PASSWORD }};AllowPublicKeyRetrieval=true;" \
              ${{ env.APP_NAME }}:latest
          fi

      - name: 🔍 Health Check App
        run: |
          url="http://localhost:${{ env.HOST_PORT }}/swagger/v1/swagger.json"
          echo "⏳ Polling $url in ${REGION}..."
          for i in $(seq 1 20); do
            code=$(curl -so /dev/null -w "%{http_code}" "$url" 2>/dev/null || echo "000")
            if [ "$code" = "200" ]; then
              echo "✅ HEALTH CHECK PASSED (HTTP $code) in ${REGION}"
              exit 0
            fi
            echo "  attempt $i/20 — HTTP $code"
            sleep 5
          done
          echo "❌ HEALTH CHECK FAILED in ${REGION}"
          docker logs --tail 60 ${{ env.CONTAINER_NAME }}
          exit 1

      - name: 🕷️ Fullstack DAST Scan (OWASP ZAP)
        if: needs.dr-check.outputs.is_dr == 'false'
        run: |
          mkdir -p /tmp/zap-out
          docker run --rm \
            -v /tmp/zap-out:/zap/wrk:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
            -t http://localhost:${{ env.HOST_PORT }}/swagger/v1/swagger.json \
            -f openapi -r dast_report.html || echo "⚠️ Security findings detected."
          echo "✅ DAST completed in ${REGION}"

      - name: 📤 Upload ZAP Report
        if: always() && needs.dr-check.outputs.is_dr == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: /tmp/zap-out/
          retention-days: 7

  # ==========================================
  # [PHASE 8: CLEANUP]
  # ==========================================
  cleanup:
    name: 🧹 SRE Cleanup
    runs-on: ${{ fromJSON(needs.dr-check.outputs.runner_label) }}
    needs: [dr-check, deploy]
    if: always() && github.event.inputs.cleanup_resources == 'true' && needs.dr-check.outputs.is_dr == 'false'
    env:
      MS_PORT: ${{ needs.dr-check.outputs.ministack_port }}
      REGION: ${{ needs.dr-check.outputs.region }}
      ENV_NAME: ${{ needs.dr-check.outputs.env_name }}
      RUNNER_TYPE: ${{ needs.dr-check.outputs.runner_type }}
    steps:
      - name: 🗑️ Cleanup Ministack Resources
        run: |
          ENDPOINT_URL="http://localhost:${MS_PORT}"
          
          for db in $(docker run --rm \
            -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            -e AWS_DEFAULT_REGION=${REGION} \
            amazon/aws-cli rds describe-db-instances \
            --endpoint-url "$ENDPOINT_URL" \
            --query "DBInstances[?starts_with(DBInstanceIdentifier, 'ministack-mysql-${ENV_NAME}')].DBInstanceIdentifier" \
            --output text 2>/dev/null); do
            docker run --rm \
              -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
              -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
              -e AWS_DEFAULT_REGION=${REGION} \
              amazon/aws-cli rds delete-db-instance \
              --db-instance-identifier "$db" \
              --skip-final-snapshot \
              --endpoint-url "$ENDPOINT_URL" 2>/dev/null || true
          done

          if [ "${{ env.RUNNER_TYPE }}" == "self-hosted" ]; then
            docker rm -f ${{ env.CONTAINER_NAME }} ministack 2>/dev/null || true
          else
            docker rm -f ${{ env.CONTAINER_NAME }} 2>/dev/null || true
          fi
          echo "✅ Cleanup complete in ${REGION}"

  # ==========================================
  # [PHASE 9: MISSION SUMMARY]
  # ==========================================
  notify:
    name: 📢 Mission Summary
    runs-on: ubuntu-latest
    needs: [dr-check, deploy]
    if: always()
    steps:
      - run: |
          echo "========================================"
          echo "🛡️ DEVSECOPS PIPELINE SUMMARY"
          echo "========================================"
          echo "Force Primary    : ${{ needs.dr-check.outputs.force_primary }}"
          echo "Target Region    : ${{ needs.dr-check.outputs.region }}"
          echo "Runner Type      : ${{ needs.dr-check.outputs.runner_type }}"
          echo "Deployment       : ${{ needs.deploy.result }}"
          echo "========================================"
          echo "🌐 App URL: http://localhost:${{ env.HOST_PORT }}"
