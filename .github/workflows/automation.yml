name: 🛡️ Enterprise DevSecOps CI/CD (Bare-Metal Native DR)

on:
  push:
    branches: [main, develop]
    paths:
      - 'TodoWebAPI/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      manual_dr_trigger:
        description: 'Force DR failover to us-east-2 (laptop)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']
      cleanup_resources:
        description: 'Cleanup after pipeline? (ephemeral env only)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

env:
  DOTNET_VERSION: '8.0.x'
  APP_NAME: todo-webapi
  CONTAINER_NAME: todo-webapi
  HOST_PORT: 5000
  AWS_REGION_PRIMARY: us-east-1
  AWS_REGION_DR: us-east-2
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  DB_NAME: ${{ secrets.DB_NAME }}
  DB_USER: ${{ secrets.DB_USER }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET || '' }}

permissions:
  contents: read
  security-events: write
  actions: read
  checks: write

jobs:
  # ==========================================
  # [PHASE 1: RADAR - AUTOMATED HEALTHCHECK & DR DECISION]
  # ==========================================
  dr-check:
    name: 🧠 Intelligence & Health Recon
    runs-on: ubuntu-latest
    outputs:
      runner_label:   ${{ steps.radar.outputs.runner }}
      active_region:  ${{ steps.radar.outputs.region }}
      ministack_port: ${{ steps.radar.outputs.port }}
      is_dr:          ${{ steps.radar.outputs.is_dr }}
      failover:       ${{ steps.radar.outputs.failover }}
      state_key:      ${{ steps.radar.outputs.state_key }}
      use_s3_backend: ${{ steps.radar.outputs.use_s3_backend }}
      should_cleanup: ${{ steps.radar.outputs.should_cleanup }}
      env_name:       ${{ steps.radar.outputs.env_name }}
    steps:
      - id: radar
        run: |
          FAIL="${{ github.event.inputs.manual_dr_trigger }}"
          CLEANUP_INPUT="${{ github.event.inputs.cleanup_resources }}"
          BRANCH="${{ github.ref_name }}"
          ENV_NAME="staging"

          SHOULD_CLEANUP="false"
          if [ "$CLEANUP_INPUT" == "true" ]; then
            SHOULD_CLEANUP="true"
          elif [ "$BRANCH" != "main" ] && [ "$BRANCH" != "develop" ]; then
            SHOULD_CLEANUP="true"
          fi
          echo "should_cleanup=$SHOULD_CLEANUP" >> $GITHUB_OUTPUT

          echo "📡 Scanning Primary Region us-east-1..."
          STATUS="UP"
          if ! curl -sf --connect-timeout 5 "http://localhost:4566/_localstack/health" > /dev/null 2>&1; then
            echo "🚨 ALERT: us-east-1 is DOWN!"
            STATUS="DOWN"
          fi

          if [ "$STATUS" == "DOWN" ] || [ "$FAIL" == "true" ]; then
            echo "🚀 ACTION: Initiating Failover to us-east-2 (Bare-Metal Laptop)"
            echo 'runner=["self-hosted","linux","x64"]' >> $GITHUB_OUTPUT
            echo "region=${{ env.AWS_REGION_DR }}" >> $GITHUB_OUTPUT
            echo "port=4566" >> $GITHUB_OUTPUT
            echo "state_key=ministack/us-east-2/${ENV_NAME}/terraform.tfstate" >> $GITHUB_OUTPUT
            echo "use_s3_backend=false" >> $GITHUB_OUTPUT
            echo "is_dr=true" >> $GITHUB_OUTPUT
            echo "failover=true" >> $GITHUB_OUTPUT
          else
            echo "🟢 ACTION: Staying on Primary us-east-1 (GitHub Cloud)"
            echo 'runner=["ubuntu-latest"]' >> $GITHUB_OUTPUT
            echo "region=${{ env.AWS_REGION_PRIMARY }}" >> $GITHUB_OUTPUT
            echo "port=4566" >> $GITHUB_OUTPUT
            echo "state_key=ministack/us-east-1/${ENV_NAME}/terraform.tfstate" >> $GITHUB_OUTPUT
            USE_S3="false"
            [ -n "${{ env.TF_STATE_BUCKET }}" ] && USE_S3="true"
            echo "use_s3_backend=$USE_S3" >> $GITHUB_OUTPUT
            echo "is_dr=false" >> $GITHUB_OUTPUT
            echo "failover=false" >> $GITHUB_OUTPUT
          fi
          echo "env_name=$ENV_NAME" >> $GITHUB_OUTPUT

  # ==========================================
  # [PHASE 2: BUILD & SECURITY SAST/SCA – PRIMARY ONLY]
  # ==========================================
  sast:
    name: 🔐 SAST & Secrets
    runs-on: ubuntu-latest
    if: needs.dr-check.outputs.is_dr == 'false'
    needs: dr-check
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 🔐 Gitleaks – Secret Scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: 🧬 Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
      - name: 🔨 Build for CodeQL
        run: cd TodoWebAPI && dotnet build TodoWebAPI.csproj
      - name: 🧬 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  sca:
    name: 📦 SCA & SBOM
    runs-on: ubuntu-latest
    if: needs.dr-check.outputs.is_dr == 'false'
    needs: dr-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: 🔍 Audit NuGet vulnerabilities
        run: |
          dotnet restore TodoWebAPI/*.csproj
          dotnet list TodoWebAPI/*.csproj package --vulnerable --include-transitive || true
      - name: 📄 Generate SBOM (CycloneDX)
        uses: CycloneDX/gh-dotnet-generate-sbom@v1
        with:
          path: TodoWebAPI
          output: sbom.xml
      - name: 📤 Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: app-sbom
          path: TodoWebAPI/sbom.xml
          retention-days: 7

  build:
    name: 🔨 Build Application
    runs-on: ubuntu-latest
    if: needs.dr-check.outputs.is_dr == 'false'
    needs: [dr-check, sast, sca]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: 🩹 Patch Microsoft.Build vulnerabilities
        run: |
          dotnet add TodoWebAPI/TodoWebAPI.csproj package Microsoft.Build --version 17.8.43
          dotnet add TodoWebAPI/TodoWebAPI.csproj package Microsoft.Build.Tasks.Core --version 17.8.43
          dotnet add TodoWebAPI/TodoWebAPI.csproj package Microsoft.Build.Utilities.Core --version 17.8.43
          dotnet restore TodoWebAPI/TodoWebAPI.csproj --force
      - name: 🔨 Restore, Build & Publish
        run: |
          dotnet restore TodoWebAPI/*.csproj
          dotnet build   TodoWebAPI/*.csproj -c Release --no-restore
          dotnet publish TodoWebAPI/*.csproj -c Release --no-build -o publish_output
      - name: 📤 Upload App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-binaries
          path: publish_output/
          retention-days: 1

  container:
    name: 🐳 Container Build & Scan
    runs-on: ubuntu-latest
    if: needs.dr-check.outputs.is_dr == 'false'
    needs: [dr-check, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: webapp-binaries
          path: deploy/publish
      - name: 🐳 Create hardened Dockerfile
        run: |
          cat > deploy/Dockerfile << 'DOCKERFILE'
          FROM mcr.microsoft.com/dotnet/aspnet:8.0-alpine
          WORKDIR /app
          RUN apk update && apk upgrade --no-cache \
           && apk add --no-cache openssl \
           && openssl req -x509 -newkey rsa:4096 \
                -keyout /tmp/key.pem -out /tmp/cert.pem \
                -days 365 -nodes -subj '/CN=localhost' \
           && openssl pkcs12 -export \
                -out /app/aspnetapp.pfx \
                -inkey /tmp/key.pem -in /tmp/cert.pem \
                -passout pass:devpassword \
           && rm /tmp/key.pem /tmp/cert.pem \
           && apk del openssl
          ENV ASPNETCORE_ENVIRONMENT=Production \
              ASPNETCORE_Kestrel__Certificates__Default__Path=/app/aspnetapp.pfx \
              ASPNETCORE_Kestrel__Certificates__Default__Password=devpassword
          RUN adduser -u 1000 --disabled-password --gecos "" appuser \
           && mkdir -p /app/logs \
           && chown -R appuser:appuser /app
          USER appuser
          EXPOSE 5000
          COPY --chown=appuser:appuser publish/ /app/
          ENTRYPOINT ["dotnet", "TodoWebAPI.dll"]
          DOCKERFILE
      - name: 🏗️ Build Docker Image
        run: docker build -t ${{ env.APP_NAME }}:latest ./deploy
      - name: 🛡️ Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.APP_NAME }}:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
      - name: 💾 Save & Upload Docker Image
        run: docker save ${{ env.APP_NAME }}:latest | gzip > ${{ env.APP_NAME }}-image.tar.gz
      - name: 📤 Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: ${{ env.APP_NAME }}-image.tar.gz
          retention-days: 7

  # ==========================================
  # [PHASE 3: INFRASTRUCTURE PROVISIONING – BOTH ENVS]
  # ==========================================
  infra:
    name: 🏗️ IaC Provisioning
    runs-on: ${{ fromJSON(needs.dr-check.outputs.runner_label) }}
    needs: dr-check
    outputs:
      rds_endpoint: ${{ steps.tf.outputs.rds_endpoint }}
    env:
      MS_PORT: ${{ needs.dr-check.outputs.ministack_port }}
      REGION:  ${{ needs.dr-check.outputs.active_region }}
      ENV_NAME: ${{ needs.dr-check.outputs.env_name }}
    steps:
      - uses: actions/checkout@v4

      - name: 🔧 Install Terraform & Start Ministack (Primary)
        if: needs.dr-check.outputs.is_dr == 'false'
        run: |
          if ! command -v terraform &>/dev/null; then
            curl -fsSL https://apt.releases.hashicorp.com/gpg \
              | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] \
              https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
              | sudo tee /etc/apt/sources.list.d/hashicorp.list
            sudo apt-get update -qq && sudo apt-get install -y terraform
          fi
          terraform version

          docker rm -f ministack 2>/dev/null || true
          docker run -d --name ministack \
            --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e SERVICES=ec2,s3,sts,iam,rds \
            -e DEFAULT_REGION=${REGION} \
            nahuelnucera/ministack:latest

          echo "⏳ Waiting for Ministack services..."
          for i in $(seq 1 40); do
            STATUS=$(curl -sf "http://localhost:${MS_PORT}/_localstack/health" 2>/dev/null || echo '{}')
            S3=$(echo  "$STATUS" | python3 -c "import sys,json; print(json.load(sys.stdin).get('services',{}).get('s3',''))"  2>/dev/null)
            EC2=$(echo "$STATUS" | python3 -c "import sys,json; print(json.load(sys.stdin).get('services',{}).get('ec2',''))" 2>/dev/null)
            RDS=$(echo "$STATUS" | python3 -c "import sys,json; print(json.load(sys.stdin).get('services',{}).get('rds',''))" 2>/dev/null)
            if [ "$S3" = "available" ] && [ "$EC2" = "available" ] && [ "$RDS" = "available" ]; then
              echo "✅ Ministack ready"
              break
            fi
            sleep 3
          done

      - name: 💻 Verify Local Environment (DR)
        if: needs.dr-check.outputs.is_dr == 'true'
        run: |
          terraform version || { echo "❌ Terraform not found."; exit 1; }
          if ! docker ps --format '{{.Names}}' | grep -q '^ministack$'; then
            echo "❌ Ministack not running. Start with:"
            echo "   docker run -d --name ministack --network host -v /var/run/docker.sock:/var/run/docker.sock -e SERVICES=ec2,s3,sts,iam,rds nahuelnucera/ministack:latest"
            exit 1
          fi
          for i in $(seq 1 10); do
            curl -sf "http://localhost:${MS_PORT}/_localstack/health" && break
            sleep 2
          done
          echo "✅ Ministack ready"

      - name: 📝 Create Terraform config
        run: |
          mkdir -p terraform
          cat > terraform/main.tf << 'TFEOF'
          terraform {
            required_providers {
              aws    = { source = "hashicorp/aws",    version = "~> 5.0" }
              random = { source = "hashicorp/random", version = "~> 3.0" }
            }
          }

          variable "ministack_endpoint" {}
          variable "environment"        {}
          variable "aws_region"         {}
          variable "db_name"            { sensitive = true }
          variable "db_user"            { sensitive = true }
          variable "db_password"        { sensitive = true }

          provider "aws" {
            region                      = var.aws_region
            access_key                  = "test"
            secret_key                  = "test"
            skip_credentials_validation = true
            skip_requesting_account_id  = true
            skip_metadata_api_check     = true
            s3_use_path_style           = true
            endpoints {
              ec2 = var.ministack_endpoint
              s3  = var.ministack_endpoint
              sts = var.ministack_endpoint
              iam = var.ministack_endpoint
              rds = var.ministack_endpoint
            }
          }

          resource "random_id" "suffix" { byte_length = 4 }

          resource "aws_security_group" "web_sg" {
            name        = "web-sg-${var.environment}-${var.aws_region}"
            description = "SG for ${var.aws_region}"
            tags = { Name = "web-sg-${var.environment}", Project = "DevSecOps" }
            ingress {
              from_port   = 80
              to_port     = 80
              protocol    = "tcp"
              cidr_blocks = ["0.0.0.0/0"]
            }
            ingress {
              from_port   = 443
              to_port     = 443
              protocol    = "tcp"
              cidr_blocks = ["0.0.0.0/0"]
            }
            egress {
              from_port   = 0
              to_port     = 0
              protocol    = "-1"
              cidr_blocks = ["0.0.0.0/0"]
            }
          }

          resource "aws_instance" "web" {
            ami             = "ami-0ff8a91507f77f867"
            instance_type   = "t2.micro"
            security_groups = [aws_security_group.web_sg.name]
            tags = { Name = "web-server-${var.environment}", Project = "DevSecOps" }
          }

          resource "aws_s3_bucket" "artifacts" {
            bucket = "artifacts-${var.environment}-${var.aws_region}-${random_id.suffix.hex}"
            tags   = { Project = "DevSecOps" }
          }

          resource "aws_db_instance" "mysql" {
            identifier          = "ministack-mysql-${var.environment}"
            engine              = "mysql"
            engine_version      = "8.0"
            instance_class      = "db.t3.micro"
            allocated_storage   = 20
            db_name             = var.db_name
            username            = var.db_user
            password            = var.db_password
            port                = 3306
            skip_final_snapshot = true
            apply_immediately   = true
            publicly_accessible = true
            tags = { Project = "DevSecOps" }
          }

          output "rds_endpoint" { value = aws_db_instance.mysql.endpoint }
          output "s3_bucket"    { value = aws_s3_bucket.artifacts.bucket }
          TFEOF

          cat > terraform/terraform.tfvars << EOF
          ministack_endpoint = "http://localhost:${MS_PORT}"
          environment        = "${ENV_NAME}"
          aws_region         = "${REGION}"
          EOF

          if [ "${{ needs.dr-check.outputs.use_s3_backend }}" == "true" ]; then
            cat > terraform/backend.tf << EOF
          terraform {
            backend "s3" {
              bucket  = "${{ env.TF_STATE_BUCKET }}"
              key     = "${{ needs.dr-check.outputs.state_key }}"
              region  = "us-east-1"
              encrypt = true
            }
          }
          EOF
          fi

      - name: 🗃️ Terraform Init & Apply
        id: tf
        working-directory: terraform
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_STATE_ACCESS_KEY || secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_STATE_SECRET_KEY || secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    us-east-1
          TF_VAR_db_name:        ${{ secrets.DB_NAME }}
          TF_VAR_db_user:        ${{ secrets.DB_USER }}
          TF_VAR_db_password:    ${{ secrets.DB_PASSWORD }}
        run: |
          if [ "${{ needs.dr-check.outputs.use_s3_backend }}" == "true" ]; then
            terraform init -input=false -reconfigure -upgrade \
              -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
              -backend-config="key=${{ needs.dr-check.outputs.state_key }}" \
              -backend-config="region=us-east-1" \
              -backend-config="encrypt=true"
          else
            terraform init -input=false -reconfigure -upgrade
          fi
          terraform apply -auto-approve -input=false
          echo "rds_endpoint=$(terraform output -raw rds_endpoint)" >> $GITHUB_OUTPUT

  # ==========================================
  # [PHASE 4: DB INIT – BOTH ENVS]
  # ==========================================
  db-init:
    name: 🗂️ DB Healthcheck & Init
    runs-on: ${{ fromJSON(needs.dr-check.outputs.runner_label) }}
    needs: [dr-check, infra]
    env:
      MS_PORT:  ${{ needs.dr-check.outputs.ministack_port }}
      REGION:   ${{ needs.dr-check.outputs.active_region }}
      ENV_NAME: ${{ needs.dr-check.outputs.env_name }}
    steps:
      - name: 🐳 Ensure Ministack & RDS
        run: |
          ENDPOINT_URL="http://localhost:${MS_PORT}"
          DB_ID="ministack-mysql-${ENV_NAME}"

          if ! docker ps --format '{{.Names}}' | grep -q '^ministack$'; then
            echo "⚠️ Ministack not found, restarting..."
            docker rm -f ministack 2>/dev/null || true
            docker run -d --name ministack \
              --network host \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -e SERVICES=ec2,s3,sts,iam,rds \
              -e DEFAULT_REGION=${REGION} \
              nahuelnucera/ministack:latest

            for i in $(seq 1 40); do
              STATUS=$(curl -sf "http://localhost:${MS_PORT}/_localstack/health" 2>/dev/null || echo '{}')
              RDS=$(echo "$STATUS" | python3 -c "import sys,json; print(json.load(sys.stdin).get('services',{}).get('rds',''))" 2>/dev/null)
              [ "$RDS" = "available" ] && { echo "✅ Ministack ready"; break; }
              sleep 3
            done
          else
            echo "✅ Ministack already running"
          fi

          docker run --rm --network host \
            -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            -e AWS_DEFAULT_REGION=${REGION} \
            amazon/aws-cli rds create-db-instance \
              --db-instance-identifier "$DB_ID" \
              --db-instance-class db.t3.micro \
              --engine mysql --engine-version "8.0" \
              --master-username "${{ env.DB_USER }}" \
              --master-user-password "${{ env.DB_PASSWORD }}" \
              --db-name "${{ env.DB_NAME }}" \
              --allocated-storage 20 \
              --no-multi-az --publicly-accessible \
              --no-deletion-protection \
              --endpoint-url "$ENDPOINT_URL" 2>/dev/null || true

          echo "⏳ Waiting for RDS..."
          for i in $(seq 1 60); do
            STATUS=$(docker run --rm --network host \
              -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
              -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
              -e AWS_DEFAULT_REGION=${REGION} \
              amazon/aws-cli rds describe-db-instances \
                --db-instance-identifier "$DB_ID" \
                --query "DBInstances[0].DBInstanceStatus" \
                --output text \
                --endpoint-url "$ENDPOINT_URL" 2>/dev/null || echo "creating")
            [ "$STATUS" = "available" ] && { echo "✅ RDS available"; break; }
            sleep 5
          done

          MYSQL_CONTAINER="$DB_ID"
          echo "🔍 Hunting IP for container $MYSQL_CONTAINER"
          for i in $(seq 1 30); do
            DB_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$MYSQL_CONTAINER" 2>/dev/null || echo "")
            if [ -n "$DB_IP" ]; then
              echo "✅ MySQL container IP: $DB_IP"
              break
            fi
            sleep 2
          done
          if [ -z "$DB_IP" ]; then
            echo "❌ Could not determine MySQL container IP"
            exit 1
          fi
          DB_PORT=3306
          echo "RDS_HOST=$DB_IP" >> $GITHUB_ENV
          echo "RDS_PORT=$DB_PORT" >> $GITHUB_ENV
          echo "✅ RDS endpoint (internal): $DB_IP:$DB_PORT"

      - name: 🏥 MySQL Health Check
        run: |
          echo "⏳ Waiting for MySQL at ${RDS_HOST}:${RDS_PORT}..."
          for i in $(seq 1 60); do
            docker run --rm --network host mysql:8.0 \
              mysql --protocol=TCP -h"${RDS_HOST}" -P"${RDS_PORT}" \
              -u"${{ env.DB_USER }}" -p"${{ env.DB_PASSWORD }}" \
              --connect-timeout=5 -e "SELECT 1" 2>/dev/null \
              && { echo "✅ MySQL READY (attempt $i)"; exit 0; }
            sleep 5
          done
          echo "❌ MySQL never became ready"
          exit 1

      - name: 🗂️ Schema Initialization
        run: |
          docker run -i --rm --network host mysql:8.0 \
            mysql --protocol=TCP -h"${RDS_HOST}" -P"${RDS_PORT}" \
            -u"${{ env.DB_USER }}" -p"${{ env.DB_PASSWORD }}" "${{ env.DB_NAME }}" << 'SQL'
          CREATE TABLE IF NOT EXISTS TodoItems (
            Id         INT          PRIMARY KEY AUTO_INCREMENT,
            Name       VARCHAR(255) NULL,
            IsComplete TINYINT(1)   NOT NULL DEFAULT 0,
            CreatedAt  TIMESTAMP    DEFAULT CURRENT_TIMESTAMP,
            UpdatedAt  TIMESTAMP    DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
          ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
          SQL
          echo "✅ Schema ready in ${REGION}"

  # ==========================================
  # [PHASE 5: DEPLOY & FULLSTACK DAST]
  # ==========================================
  deploy:
    name: 🚀 Deploy & Fullstack DAST
    runs-on: ${{ fromJSON(needs.dr-check.outputs.runner_label) }}
    needs: [dr-check, sast, sca, container, db-init, infra]
    if: |
      always() &&
      (needs.dr-check.outputs.is_dr == 'true' ||
       (needs.sast.result == 'success' && needs.sca.result == 'success' &&
        needs.container.result == 'success' && needs.db-init.result == 'success'))
    env:
      MS_PORT:  ${{ needs.dr-check.outputs.ministack_port }}
      REGION:   ${{ needs.dr-check.outputs.active_region }}
      ENV_NAME: ${{ needs.dr-check.outputs.env_name }}
    steps:
      - name: ⬇️ Download Golden Image (Primary — current run)
        if: needs.dr-check.outputs.is_dr == 'false'
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: .

      - name: ⬇️ Download Golden Image (DR — latest main build)
        if: needs.dr-check.outputs.is_dr == 'true'
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: ${{ github.workflow }}
          branch: main
          name: docker-image
          path: .
          search_artifacts: true
          if_no_artifact_found: fail

      - name: 📦 Load Image
        run: docker load < ${{ env.APP_NAME }}-image.tar.gz

      - name: 🔍 Parse RDS Endpoint
        run: |
          ep="${{ needs.infra.outputs.rds_endpoint }}"
          if [[ "$ep" == *":"* ]]; then
            host="${ep%:*}"
            port="${ep##*:}"
          else
            host="$ep"
            port="3306"
          fi
          [ "$host" = "localhost" ] && host="127.0.0.1"
          echo "RDS_HOST=$host" >> $GITHUB_ENV
          echo "RDS_PORT=$port" >> $GITHUB_ENV
          echo "Using RDS at $host:$port"

      - name: 🧹 Remove Old Container
        run: docker rm -f ${{ env.CONTAINER_NAME }} 2>/dev/null || true

      - name: 🚀 Run App Container
        run: |
          docker run -d --name ${{ env.CONTAINER_NAME }} \
            --network host \
            --security-opt="no-new-privileges:true" \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --tmpfs /app/logs:rw,noexec,nosuid,size=32m \
            -e ASPNETCORE_URLS="http://+:${{ env.HOST_PORT }}" \
            -e ASPNETCORE_ENVIRONMENT=Production \
            -e "ConnectionStrings__DefaultConnection=Server=${RDS_HOST};Port=${RDS_PORT};Database=${{ env.DB_NAME }};Uid=${{ env.DB_USER }};Pwd=${{ env.DB_PASSWORD }};AllowPublicKeyRetrieval=true;" \
            ${{ env.APP_NAME }}:latest

      - name: 🔍 Health Check App
        run: |
          url="http://localhost:${{ env.HOST_PORT }}/swagger/v1/swagger.json"
          echo "⏳ Polling $url in ${REGION}..."
          for i in $(seq 1 20); do
            code=$(curl -so /dev/null -w "%{http_code}" "$url" 2>/dev/null || echo "000")
            if [ "$code" = "200" ]; then
              echo "✅ HEALTH CHECK PASSED (HTTP $code) in ${REGION}"
              exit 0
            fi
            echo "  attempt $i/20 — HTTP $code"
            sleep 5
          done
          echo "❌ HEALTH CHECK FAILED"
          docker logs --tail 60 ${{ env.CONTAINER_NAME }}
          exit 1

      - name: 🕷️ Fullstack DAST Scan (OWASP ZAP)
        if: needs.dr-check.outputs.is_dr == 'false'
        run: |
          mkdir -p /tmp/zap-out
          docker run --rm --network host \
            -v /tmp/zap-out:/zap/wrk:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
            -t http://localhost:${{ env.HOST_PORT }}/swagger/v1/swagger.json \
            -f openapi -r dast_report.html \
          || echo "⚠️ Security findings detected."
          echo "✅ DAST completed"

      - name: 📤 Upload ZAP Report
        if: always() && needs.dr-check.outputs.is_dr == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: /tmp/zap-out/
          retention-days: 7

  # ==========================================
  # [PHASE 6: CLEANUP – PRIMARY ONLY]
  # ==========================================
  cleanup:
    name: 🧹 Cleanup (Ephemeral)
    runs-on: ${{ fromJSON(needs.dr-check.outputs.runner_label) }}
    needs: [dr-check, deploy]
    if: |
      always() &&
      needs.dr-check.outputs.should_cleanup == 'true' &&
      needs.dr-check.outputs.is_dr == 'false'
    env:
      MS_PORT:  ${{ needs.dr-check.outputs.ministack_port }}
      REGION:   ${{ needs.dr-check.outputs.active_region }}
      ENV_NAME: ${{ needs.dr-check.outputs.env_name }}
    steps:
      - name: 🗑️ Cleanup Resources
        run: |
          ENDPOINT_URL="http://localhost:${MS_PORT}"
          DB_ID="ministack-mysql-${ENV_NAME}"
          AWS_RUN="docker run --rm --network host \
            -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            -e AWS_DEFAULT_REGION=${REGION} \
            amazon/aws-cli"

          docker rm -f ${{ env.CONTAINER_NAME }} 2>/dev/null || true
          if docker ps --format '{{.Names}}' | grep -q '^ministack$'; then
            $AWS_RUN rds delete-db-instance --db-instance-identifier "$DB_ID" --skip-final-snapshot --endpoint-url "$ENDPOINT_URL" 2>/dev/null || true
            $AWS_RUN ec2 describe-instances --filters "Name=tag:Project,Values=DevSecOps" --query "Reservations[*].Instances[*].InstanceId" --output text --endpoint-url "$ENDPOINT_URL" 2>/dev/null | tr '\t' '\n' | grep -v '^$' | while read -r ID; do
              [ -n "$ID" ] && [ "$ID" != "None" ] && $AWS_RUN ec2 terminate-instances --instance-ids "$ID" --endpoint-url "$ENDPOINT_URL" 2>/dev/null || true
            done
            $AWS_RUN s3api list-buckets --query "Buckets[?starts_with(Name,'artifacts-${ENV_NAME}')].Name" --output text --endpoint-url "$ENDPOINT_URL" 2>/dev/null | tr '\t' '\n' | grep -v '^$' | while read -r BUCKET; do
              [ -n "$BUCKET" ] && [ "$BUCKET" != "None" ] && $AWS_RUN s3 rb "s3://$BUCKET" --force --endpoint-url "$ENDPOINT_URL" 2>/dev/null || true
            done
          fi
          docker rm -f ministack 2>/dev/null || true
          echo "✅ Cleanup complete"

  # ==========================================
  # [PHASE 7: SUMMARY]
  # ==========================================
  notify:
    name: 📢 Mission Summary
    runs-on: ubuntu-latest
    needs: [dr-check, deploy, cleanup]
    if: always()
    steps:
      - run: |
          echo "========================================"
          echo "🛡️  PCA BARE-METAL DR STATUS"
          echo "========================================"
          echo "Region Primary : us-east-1"
          echo "Target Region  : ${{ needs.dr-check.outputs.active_region }}"
          echo "Runner Type    : ${{ needs.dr-check.outputs.is_dr == 'true' && '💻 NATIVE LAPTOP' || '☁️ GITHUB CLOUD' }}"
          echo "Terraform Mode : ✅ BARE-METAL NATIVE"
          echo "Deployment     : ${{ needs.deploy.result }}"
          echo "========================================"
          echo "URL: http://localhost:${{ env.HOST_PORT }}"
